[project]
name = "langgraph-playground"
version = "0.1.0"
description = "Practice playground for LangChain and LangGraph (Python)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.5.2",
    "langchain-anthropic>=1.7.12",
    "langchain-core>=1.8.4",
    "langchain-ollama>=1.2.0",
    "langchain-openai>=1.8.5",
    "langgraph>=1.2.24",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playground"]

[dependency-groups]
dev = [
    "debugpy>=1.8.22",
    "langgraph-cli[inmem]>=0.4.43",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]  # keep hand-aligned comments in docs code blocks

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
